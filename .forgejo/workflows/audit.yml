name: Docs Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Markdown audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run markdown audit
        run: |
          set +e
          echo "=== Beetle Studio docs audit ==="
          echo ""

          files_ok=0
          files_warn=0
          total_issues=0

          for md in $(find . -name '*.md' \
              -not -path './.git/*' \
              -not -path './_backup_*' \
              -not -path '*/profile_avatars/*' \
              -not -path '*/_scripts/*'); do
            issues=""

            for field in Project Owner Reviewers "ISO Standards" Version "Last Updated"; do
              if ! grep -qE "^\*\*${field}(\s*\(.*\))?:\*\*" "$md"; then
                issues="${issues}missing-header:${field} "
              fi
            done

            for section in "## Overview" "## Scope & Audience" "## Document Maintenance" "## References"; do
              if ! grep -qE "^${section// /\\\\ }" "$md"; then
                issues="${issues}missing-section:${section} "
              fi
            done

            if grep -qE '^## Scope *& *Audience' "$md"; then
              if ! awk '/^## Scope *& *Audience/{f=1} f && /Di.taxis/ {print; exit} f && /^## /{exit}' "$md" | grep -q .; then
                issues="${issues}missing-diataxis "
              fi
            fi

            if grep -qE '^## Document Maintenance' "$md"; then
              if ! awk '/^## Document Maintenance/{f=1} f && /^### Change Log/{print; exit}' "$md" | grep -q .; then
                issues="${issues}missing-changelog "
              fi
              if ! awk '/^## Document Maintenance/{f=1} f && /Review Cadence/{print; exit}' "$md" | grep -q .; then
                issues="${issues}missing-review-cadence "
              fi
            fi

            if [ -z "$issues" ]; then
              files_ok=$((files_ok + 1))
            else
              files_warn=$((files_warn + 1))
              count=$(echo $issues | wc -w)
              total_issues=$((total_issues + count))
              echo "WARN: $md -- $issues"
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "files_ok:      $files_ok"
          echo "files_warn:    $files_warn"
          echo "total_issues:  $total_issues"
          echo "::notice::Audit: ${files_ok} files OK, ${files_warn} files with warnings, ${total_issues} total issues"
          exit 0
