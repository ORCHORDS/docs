name: Documentation issue
description: Report public documentation that is wrong, outdated, unclear, or missing
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Path or public URL of the affected document
      placeholder: security/SECURITY_POLICY.md
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Incorrect or outdated claim
        - Broken link or navigation
        - Unclear procedure
        - Missing documentation
        - Public-safety concern
        - Standards/reference update
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe the problem without including secrets or sensitive details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source or evidence
      description: Prefer a primary public source when the issue is factual or standards-based.
    validations:
      required: false
