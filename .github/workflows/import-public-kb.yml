name: Import sanitized knowledge transfer

on:
  push:
    paths:
      - .github/workflows/import-public-kb.yml
      - scripts/import_verified_kb.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-sanitized-knowledge-transfer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFER_URL: https://tumor-mac-gulf-sacred.trycloudflare.com
      EXPECTED_ARCHIVE_SHA256: e2e69ffb088ceb3f3b37f8aa7a1b7352c695a63ba5bd188c258ee8c2e5e373fb
      EXPECTED_ARCHIVE_BYTES: '17527018'
      EXPECTED_MARKDOWN_FILES: '8006'
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refresh latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Compile importer before execution
        shell: bash
        run: python -m py_compile scripts/import_verified_kb.py

      - name: Download verified sanitized transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .migration
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "$TRANSFER_URL/manifest.json" \
            --output .migration/manifest.json
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "$TRANSFER_URL/public-docs-export.tar.gz" \
            --output .migration/public-docs-export.tar.gz

      - name: Verify, neutralize, deduplicate, and import
        shell: bash
        run: python scripts/import_verified_kb.py

      - name: Remove transfer staging
        shell: bash
        run: rm -rf .migration

      - name: Run public documentation quality gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_docs.py
          python scripts/check_public_neutrality.py

      - name: Remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/import-public-kb.yml scripts/import_verified_kb.py

      - name: Commit imported knowledge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORCHORDS.COM'
          git config user.email '72497645+ORCHORDS@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No import changes to commit.'
            exit 0
          fi
          git commit -m 'docs: import sanitized reusable knowledge'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            python scripts/check_docs.py
            python scripts/check_public_neutrality.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Failed to push import after three fast-forward attempts.' >&2
          exit 1
