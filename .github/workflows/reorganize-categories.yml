name: Reorganize documentation categories

on:
  push:
    paths:
      - .github/workflows/reorganize-categories.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reorganize-documentation-categories
  cancel-in-progress: false

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move categories and rewrite Markdown links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, posixpath, re, subprocess

          categories = [
              'accessibility','ai','commercial','communications','compliance',
              'corporate-development','customer-success','customer-trust','data',
              'engineering','ethics','finance','governance','human-rights',
              'internal-audit','knowledge','legal','marketing','operations',
              'partnerships','people','physical-security','privacy','procurement',
              'product','project-delivery','quality','records','releases','research',
              'resilience','security','sop','standards','strategy','support',
              'sustainability','tax','templates','third-party','treasury',
              'workplace-safety'
          ]

          root = Path('.')
          dest_root = root / 'categories'
          dest_root.mkdir(exist_ok=True)

          moved = []
          for cat in categories:
              src = root / cat
              dst = dest_root / cat
              if src.is_dir():
                  if dst.exists():
                      raise SystemExit(f'destination already exists: {dst}')
                  subprocess.run(['git','mv',str(src),str(dst)], check=True)
                  moved.append(cat)

          if not moved:
              raise SystemExit('no category directories were moved')

          def old_for_new(path: str) -> str:
              for cat in moved:
                  prefix = f'categories/{cat}'
                  if path == prefix or path.startswith(prefix + '/'):
                      return cat + path[len(prefix):]
              return path

          def new_for_old(path: str) -> str:
              path = posixpath.normpath(path)
              for cat in moved:
                  if path == cat or path.startswith(cat + '/'):
                      return 'categories/' + path
              return path

          external = re.compile(r'^(?:[a-zA-Z][a-zA-Z0-9+.-]*:|//|#|/)')

          def rewrite_url(url: str, old_src: str, new_src: str) -> str:
              raw = url.strip()
              if not raw or external.match(raw):
                  return url
              wrapped = raw.startswith('<') and raw.endswith('>')
              core = raw[1:-1] if wrapped else raw
              suffix = ''
              for marker in ('#','?'):
                  if marker in core:
                      i = core.find(marker)
                      suffix = core[i:]
                      core = core[:i]
                      break
              if not core:
                  return url
              old_target = posixpath.normpath(posixpath.join(posixpath.dirname(old_src), core))
              new_target = new_for_old(old_target)
              if old_src == new_src and old_target == new_target:
                  return url
              new_rel = posixpath.relpath(new_target, posixpath.dirname(new_src) or '.')
              if core.endswith('/') and not new_rel.endswith('/'):
                  new_rel += '/'
              result = new_rel + suffix
              if wrapped:
                  result = '<' + result + '>'
              return result

          md_link = re.compile(r'(?P<pre>!?\[[^\]\n]*\]\()(?P<dest>[^)\n]+)(?P<post>\))')
          ref_link = re.compile(r'(?m)^(?P<pre>\s*\[[^\]\n]+\]:\s*)(?P<dest>\S+)')
          html_attr = re.compile(r'(?P<pre>\b(?:src|href)=[\"\'])(?P<dest>[^\"\']+)(?P<post>[\"\'])')

          for md in root.rglob('*.md'):
              if '.git' in md.parts:
                  continue
              new_src = md.as_posix()
              old_src = old_for_new(new_src)
              text = md.read_text(encoding='utf-8')

              def repl_md(m):
                  dest = m.group('dest')
                  path, sep, title = dest.partition(' ')
                  new_path = rewrite_url(path, old_src, new_src)
                  return m.group('pre') + new_path + (sep + title if sep else '') + m.group('post')

              def repl_ref(m):
                  return m.group('pre') + rewrite_url(m.group('dest'), old_src, new_src)

              def repl_html(m):
                  return m.group('pre') + rewrite_url(m.group('dest'), old_src, new_src) + m.group('post')

              updated = md_link.sub(repl_md, text)
              updated = ref_link.sub(repl_ref, updated)
              updated = html_attr.sub(repl_html, updated)
              if updated != text:
                  md.write_text(updated, encoding='utf-8')

          index = dest_root / 'README.md'
          lines = [
              '# Documentation Categories', '',
              'Public ORCHORDS documentation is grouped here to keep the repository root compact and easy to scan.', '',
              'Each category retains its own README and internal structure.', ''
          ]
          for cat in moved:
              title = cat.replace('-', ' ').title()
              lines.append(f'- [{title}](./{cat}/)')
          lines += ['', 'Return to the [repository overview](../README.md).', '']
          index.write_text('\n'.join(lines), encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          section = '## Documentation categories\n\nBrowse the organized category tree in [`categories/`](./categories/README.md).\n\n'
          if '## Documentation categories' not in text:
              marker = '## Public-repository boundary'
              text = text.replace(marker, section + marker)
              readme.write_text(text, encoding='utf-8')

          old_logo = root / 'assets' / 'orchords-logo.svg'
          if old_logo.exists():
              subprocess.run(['git','rm','-f',str(old_logo)], check=True)

          print(f'moved {len(moved)} categories')
          PY

      - name: Verify old category roots are gone
        shell: bash
        run: |
          set -euo pipefail
          for d in accessibility ai commercial communications compliance corporate-development customer-success customer-trust data engineering ethics finance governance human-rights internal-audit knowledge legal marketing operations partnerships people physical-security privacy procurement product project-delivery quality records releases research resilience security sop standards strategy support sustainability tax templates third-party treasury workplace-safety; do
            test ! -d "$d" || { echo "Old category still exists: $d"; exit 1; }
          done
          test -f categories/README.md
          test -f assets/1080x360.jpg
          ! grep -RIl --include='*.md' 'orchords-logo\.svg\|orchords-banner\.jpg' .

      - name: Commit organized structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORCHORDS.COM'
          git config user.email '72497645+ORCHORDS@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore(docs): organize categories under one folder'
          git push origin HEAD:main
