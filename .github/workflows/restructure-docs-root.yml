name: restructure-docs-root

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restructure-docs-root.yml"

permissions:
  contents: write

concurrency:
  group: restructure-docs-root
  cancel-in-progress: false

jobs:
  restructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure author
        run: |
          git config user.name "ORCHORDS.COM"
          git config user.email "72497645+ORCHORDS@users.noreply.github.com"

      - name: Consolidate duplicate CODEOWNERS
        run: |
          if [ -f CODEOWNERS ] && [ -f .github/CODEOWNERS ]; then
            printf '\n# Consolidated legacy ownership rules\n' >> .github/CODEOWNERS
            cat CODEOWNERS >> .github/CODEOWNERS
            rm CODEOWNERS
          fi

      - name: Restructure repository
        run: python .github/scripts/restructure_docs.py

      - name: Verify exact root layout
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')
          dirs = sorted(p.name for p in root.iterdir() if p.is_dir() and p.name != '.git')
          files = sorted(p.name for p in root.iterdir() if p.is_file())
          assert dirs == ['.github', 'assets', 'docs'], dirs
          assert files == ['CODE_OF_CONDUCT.md', 'CONTRIBUTING.md', 'LICENSE', 'README.md', 'SECURITY.md'], files
          print('root-directories:', ', '.join(dirs))
          print('root-files:', ', '.join(files))

      - name: Validate reorganized documentation
        run: |
          python .github/scripts/check_docs.py
          python .github/scripts/check_public_neutrality.py
          git diff --check

      - name: Commit restructure
        run: |
          git add -A
          git commit -m "docs: organize repository under three root folders"

      - name: Rebase onto current main
        run: |
          git pull --rebase origin main
          python .github/scripts/check_docs.py
          python .github/scripts/check_public_neutrality.py
          git diff --check HEAD^ HEAD

      - name: Push fast-forward
        run: git push origin HEAD:main
