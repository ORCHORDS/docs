name: Check private sanitized transfer access

on:
  push:
    paths:
      - .github/workflows/check-private-transfer-access.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository-token access without exposing content
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ORCHORDS/searabbit/contents/.migration/public-docs-transfer/manifest.json?ref=dfb812e0ea0b06db06b8814b1b25df457f722f6d')"
          echo "private-transfer-http-status=${code}"
          test "$code" = '200'
