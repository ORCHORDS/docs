name: one-shot documentation link repair

on:
  push:
    branches:
      - batch-70-agents-safety

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Repair broken relative Markdown links
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path
          from urllib.parse import unquote

          root = Path.cwd().resolve()
          markdown = sorted(root.rglob("*.md"))
          by_basename: dict[str, list[Path]] = {}
          for candidate in markdown:
              by_basename.setdefault(candidate.name, []).append(candidate.resolve())

          inline = re.compile(r"(?<!!)\[([^\]\n]+)\]\(([^)\n]+)\)")
          url_scheme = re.compile(r"^[a-z][a-z0-9+.-]*:", re.I)
          changed_files = 0
          redirected = 0
          delinked = 0

          for path in markdown:
              original = path.read_text(encoding="utf-8")
              lines = original.splitlines(keepends=True)
              output: list[str] = []
              fence_char: str | None = None
              fence_len = 0
              changed = False

              for line in lines:
                  stripped = line.rstrip("\r\n")
                  if fence_char is None:
                      opening = re.match(r"^[ ]{0,3}(`{3,}|~{3,})(?:[^\n]*)$", stripped)
                      if opening:
                          marker = opening.group(1)
                          fence_char = marker[0]
                          fence_len = len(marker)
                          output.append(line)
                          continue
                  else:
                      closing = re.match(
                          rf"^[ ]{{0,3}}{re.escape(fence_char)}{{{fence_len},}}[ \t]*$",
                          stripped,
                      )
                      if closing:
                          fence_char = None
                          fence_len = 0
                      output.append(line)
                      continue

                  def replace(match: re.Match[str]) -> str:
                      nonlocal changed, redirected, delinked
                      label = match.group(1)
                      raw = match.group(2).strip()
                      if not raw:
                          return match.group(0)

                      if raw.startswith("<") and ">" in raw:
                          target = raw[1:raw.find(">")]
                      else:
                          target = raw.split()[0]

                      if (
                          not target
                          or target.startswith(("#", "/", "${", "{{", "{%", "<%"))
                          or target.startswith("mailto:")
                          or url_scheme.match(target)
                      ):
                          return match.group(0)

                      path_part = target.split("#", 1)[0].split("?", 1)[0]
                      decoded = unquote(path_part)
                      if not decoded.lower().endswith(".md"):
                          return match.group(0)

                      resolved = (path.parent / decoded).resolve()
                      try:
                          resolved.relative_to(root)
                      except ValueError:
                          return match.group(0)
                      if resolved.exists():
                          return match.group(0)

                      candidates = by_basename.get(Path(decoded).name, [])
                      if len(candidates) == 1:
                          canonical = candidates[0]
                          rel = os.path.relpath(canonical, path.parent.resolve()).replace(os.sep, "/")
                          suffix = target[len(path_part):]
                          new_target = rel + suffix
                          changed = True
                          redirected += 1
                          return f"[{label}]({new_target})"

                      changed = True
                      delinked += 1
                      return label

                  new_line = inline.sub(replace, line)
                  output.append(new_line)

              updated = "".join(output)
              if changed and updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files += 1

          print(f"repair summary: changed_files={changed_files} redirected={redirected} delinked={delinked}")
          PY

      - name: Verify repaired documentation
        shell: bash
        run: |
          python .github/scripts/test_check_docs.py
          python .github/scripts/check_docs.py
          python .github/scripts/check_public_neutrality.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-links-once.yml
          git add docs
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 1
          fi
          git config user.name "ORCHORDS.COM"
          git config user.email "72497645+ORCHORDS@users.noreply.github.com"
          git commit -m "fix(docs): repair broken relative links"
          git push origin HEAD:batch-70-agents-safety
